{% if databases %}
<ul class="dads-list">
    {% for db in databases %}
    <li class="dads-item">
        <div class="dads-item__main">
            <button class="dads-button dads-button--text"
                    type="button"
                    hx-get="/api/databases/{{ db.name }}/speakers"
                    hx-target="#db-detail"
                    hx-swap="innerHTML">
                {{ db.name }}
            </button>
            <span class="u-caption u-sub">{{ db.speaker_count }} 話者</span>
        </div>
        <button class="dads-button dads-button--outline dads-button--sm"
                type="button"
                hx-delete="/api/databases/{{ db.name }}"
                hx-target="#db-list"
                hx-swap="innerHTML"
                hx-confirm="データベース「{{ db.name }}」を削除しますか？中の話者（{{ db.speaker_count }}名）ごと voice_databases/.trash/ へ退避します（あとから手で戻せます）。">
            削除
        </button>
    </li>
    {% endfor %}
</ul>
{% else %}
<p class="u-sub">データベースがまだありません。下のフォームから作成してください。</p>
{% endif %}
