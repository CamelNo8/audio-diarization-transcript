{% import 'partials/icons.html' as ic %}
<div class="dads-card">
    <h2 class="dads-card__title">{{ db_name }}</h2>
    <p class="u-caption u-sub u-mb-3">{{ speakers|length }} 話者</p>

    {% if speakers %}
    <ul class="dads-list">
        {% for s in speakers %}
        <li class="dads-item">
            <div class="dads-item__main">
                <p><strong>{{ s.speaker_name }}</strong></p>
                <audio controls preload="none" class="u-mt-2" style="max-width: 100%">
                    <source src="/api/databases/{{ db_name }}/speakers/{{ s.filename }}/audio?v={{ s.mtime }}">
                </audio>
            </div>
            <div class="u-row">
                <button class="dads-button dads-button--outline dads-button--icon" type="button"
                        title="名前を変える" aria-label="{{ s.speaker_name }} の名前を変える"
                        onclick="openDbRename('{{ db_name }}', '{{ s.filename }}', '{{ s.speaker_name }}')">
                    {{ ic.icon('edit', 20) }}
                </button>
                <button class="dads-button dads-button--outline dads-button--icon" type="button"
                        title="範囲を切り出す" aria-label="{{ s.speaker_name }} の範囲を切り出す"
                        onclick="openDbTrim('{{ db_name }}', '{{ s.filename }}', '{{ s.speaker_name }}', {{ s.mtime }})">
                    {{ ic.icon('cut', 20) }}
                </button>
                <button class="dads-button dads-button--outline dads-button--icon" type="button"
                        title="削除" aria-label="{{ s.speaker_name }} を削除"
                        hx-delete="/api/databases/{{ db_name }}/speakers/{{ s.filename }}"
                        hx-target="#db-detail"
                        hx-swap="innerHTML"
                        hx-confirm="「{{ s.speaker_name }}」を削除しますか？ゴミ箱へ退避します。">
                    {{ ic.icon('delete', 20) }}
                </button>
            </div>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p class="u-sub">このデータベースには話者がまだ登録されていません。</p>
    {% endif %}

    <div class="u-mt-5">
        <h3 class="dads-label" id="add-speaker-heading">話者を追加</h3>
        <form class="dads-stack-sm"
              hx-post="/api/databases/{{ db_name }}/speakers/upload"
              hx-target="#db-detail"
              hx-swap="innerHTML"
              hx-encoding="multipart/form-data">
            <input class="dads-file" type="file" name="files" multiple required
                   aria-labelledby="add-speaker-heading"
                   accept=".wav,.mp3,.m4a,.flac,.mp4,.mov,.ogg,.opus,.aac,.wma">
            <p class="dads-help">ファイル名が話者名になります。</p>
            <button class="dads-button" type="submit">{{ ic.icon('upload', 20) }}アップロード</button>
        </form>
    </div>
</div>
