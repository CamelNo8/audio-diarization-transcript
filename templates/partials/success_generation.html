<div class="dads-banner dads-banner--success dads-fade-in" role="status">

        <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1 14.4-4.2-4.2 1.4-1.4 2.8 2.8 5.6-5.6 1.4 1.4-7 7z"/>
    </svg>
    <div class="dads-banner__body">
        <p class="dads-banner__title">字幕を生成しました</p>

        <div class="dads-banner__actions">

            <a class="dads-button dads-button--text" href="/">最初からやり直す</a>
        </div>
