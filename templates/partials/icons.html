{#
  画面で使うアイコン。文字を減らして一目で分かるようにするために置く。

  使い方:
    {% import 'partials/icons.html' as ic %}
    {{ ic.icon('delete') }}

  常に装飾として描く（aria-hidden）。アイコンだけのボタンには、
  呼び出し側で aria-label を付けること。
#}
{% macro icon(name, size=24) %}
<svg class="dads-icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24"
     fill="currentColor" aria-hidden="true" focusable="false">
    {%- if name == 'database' -%}
    <path d="M4 6c0 1.66 3.58 3 8 3s8-1.34 8-3-3.58-3-8-3-8 1.34-8 3zm0 3.2V12c0 1.66 3.58 3 8 3s8-1.34 8-3V9.2C18.2 10.4 15.1 11 12 11s-6.2-.6-8-1.8zm0 6V18c0 1.66 3.58 3 8 3s8-1.34 8-3v-2.8c-1.8 1.2-4.9 1.8-8 1.8s-6.2-.6-8-1.8z"/>
    {%- elif name == 'upload' -%}
    <path d="M11 16V8.8L8.4 11.4 7 10l5-5 5 5-1.4 1.4L13 8.8V16h-2zM5 20v-2h14v2H5z"/>
    {%- elif name == 'download' -%}
    <path d="M12 16l-5-5 1.4-1.4 2.6 2.6V4h2v8.2l2.6-2.6L17 11l-5 5zM5 20v-2h14v2H5z"/>
    {%- elif name == 'delete' -%}
    <path d="M9 3h6v1h5v2H4V4h5V3zM6 8h12v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V8zm3 2v9h2v-9H9zm4 0v9h2v-9h-2z"/>
    {%- elif name == 'edit' -%}
    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm17.71-10.21a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
    {%- elif name == 'cut' -%}
    <path d="M9.64 7.64a3 3 0 1 0-2.83 2.33L9 12l-2.19 2.03a3 3 0 1 0 2.83 2.33L12 14l7 7h3v-1L9.64 7.64zM6 8a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm0 12a1 1 0 1 1 0-2 1 1 0 0 1 0 2zM19 3l-6 6 2 2 7-7V3h-3z"/>
    {%- elif name == 'play' -%}
    <path d="M8 5v14l11-7L8 5z"/>
    {%- elif name == 'add' -%}
    <path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/>
    {%- elif name == 'next' -%}
    <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8-8-8z"/>
    {%- elif name == 'check' -%}
    <path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
    {%- elif name == 'mic' -%}
    <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
    {%- elif name == 'close' -%}
    <path d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.3 19.71 2.89 18.3 9.17 12 2.89 5.71 4.3 4.29l6.29 6.3 6.3-6.3 1.41 1.42z"/>
    {%- endif -%}
</svg>
{%- endmacro %}
