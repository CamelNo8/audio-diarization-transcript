{# 自分自身を outerHTML で置き換えるので、完了時に返る断片に hx-trigger が
   無ければポーリングは自然に止まる（JavaScript は不要）。 #}
<div class="dads-banner dads-banner--info dads-fade-in"
     role="status"
     aria-live="polite"
     hx-get="/process/transcription/{{ job_id }}/status"
     hx-trigger="load delay:{{ poll_interval }}"
     hx-swap="outerHTML">
    <span class="dads-spinner dads-banner__icon" aria-hidden="true"></span>
    <div class="dads-banner__body">
        <p class="dads-banner__title">文字起こし中です</p>
        <p>音声の長さによって、数分から数十分かかります。</p>
        <p class="u-mt-2 u-caption u-sub">
            この画面は開いたままにしてください。閉じても処理は続きますが、結果はこの画面にしか出ません。
        </p>

        {% if log_excerpt %}
        <details class="dads-details u-mt-3" open>
            <summary>処理ログ</summary>
            <div class="dads-details__body">
                <pre class="u-scroll-y">{{ log_excerpt }}</pre>
            </div>
        </details>
        {% endif %}
    </div>
</div>
