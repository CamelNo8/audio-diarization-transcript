<div class="dads-banner dads-banner--success dads-fade-in" role="status">
    <svg class="dads-banner__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1 14.4-4.2-4.2 1.4-1.4 2.8 2.8 5.6-5.6 1.4 1.4-7 7z"/>
    </svg>
    <div class="dads-banner__body">
        <p class="dads-banner__title">マッチングが完了しました</p>
        <p>対応表 <strong>{{ filename }}</strong> を作りました。</p>
        <p class="u-mt-2">
            このあと対応表を開いて、時刻・話者・字幕の本文を確認してください。
            直したファイルを Step 3 でアップロードすると字幕になります。
        </p>

        <div class="dads-banner__actions">
            <a class="dads-button"
               href="/generation?csv={{ filename | urlencode }}{% if job_id %}&job_id={{ job_id | urlencode }}{% endif %}">
                Step 3 へ進む
            </a>
            <a class="dads-button dads-button--outline" href="{{ download_url }}">対応表をダウンロード</a>
        </div>
    </div>
</div>
